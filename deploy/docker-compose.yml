services:
  # 1. Primary PostgreSQL 16 Database (ACTIVE)
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: marketplace_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password
      ENV: development
      LOAD_DEMO_SEED: "true"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ../backend/db/migrations:/migrations:ro
      - ../backend/db/seeds:/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace_core"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 2. Go Backend REST API (ACTIVE)
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: marketplace-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENV: development
      DATABASE_URL: postgres://postgres:dev_password@postgres:5432/marketplace_core?sslmode=disable
      JWT_SECRET: nexus-enterprise-marketplace-secret-change-in-prod-2026-min-32-chars
      MARKETPLACE_CURRENCY: USD
    depends_on:
      postgres:
        condition: service_healthy

