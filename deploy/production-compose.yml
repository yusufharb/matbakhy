services:
  # 1. Primary PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: nexus-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_core}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?FATAL: POSTGRES_PASSWORD required}
      ENV: production
      LOAD_DEMO_SEED: "false"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ../backend/db/migrations:/migrations:ro
      - ../backend/db/seeds:/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-marketplace_core}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus-internal

  # 2. Go Backend REST API & Asynchronous Outbox Worker
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nexus-prod-api
    restart: always
    environment:
      PORT: "8080"
      ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketplace_core}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?FATAL: JWT_SECRET required}
      MARKETPLACE_CURRENCY: ${MARKETPLACE_CURRENCY:-USD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      GATEWAY_WEBHOOK_SECRET: ${GATEWAY_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-internal
      - nexus-public

  # 3. Production React SPA Frontend (Nginx)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: nexus-prod-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - nexus-public

networks:
  nexus-internal:
    internal: true
  nexus-public:

volumes:
  prod_postgres_data:
